<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Оповіщення + Радіо</title>
<style>
:root{color-scheme:dark;--bg:#111;--fg:#eee;--mut:#888;--ok:#3c3;--bad:#e33;--card:#1c1c1c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px system-ui,sans-serif;padding:12px;text-align:center}
#clock{font-size:56px;font-weight:700}
#state{font-size:clamp(34px,10vw,72px);font-weight:800;line-height:1.1;margin:10px 0;padding:22px 10px;border-radius:14px;background:var(--card)}
#state.red{background:#d11;color:#fff}
#state.yellow{background:#fc0;color:#111}
#state.orange{background:#e67300;color:#fff}
#state.green{background:#1a7f2e;color:#fff}
#now{font-size:clamp(24px,7vw,48px);font-weight:700;line-height:1.2;margin:12px 0 4px;word-break:break-word}
.ctl button{font-size:30px;padding:14px 20px;margin:4px;min-width:64px}
#pp{min-width:150px}
.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border-radius:10px;padding:10px;margin:10px 0;text-align:left}
button,select,input[type=password]{font:inherit;padding:10px;margin:4px 0;border-radius:8px;border:1px solid #444;background:#2a2a2a;color:var(--fg);max-width:100%}
button{cursor:pointer}
input[type=range]{width:100%}
#start{position:fixed;inset:0;background:#000d;font-size:28px;z-index:9;display:none;width:100%;border:0}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--mut);margin-right:6px}
.radio-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.radio-row select{flex:1;min-width:200px}
</style></head><body>
<button id="start">▶ Натисни для запуску</button>
<div id="clock">--:--:--</div>
<div id="state">Завантаження…</div>
<div id="now"></div>
<div class="mut" id="cnt"></div>
<div class="ctl">
<button id="prev">⏮</button><button id="pp">⏸ Стоп</button><button id="next">⏭</button><br>
<button id="mode" style="font-size:20px">🔁 По порядку</button>
</div>
<div class="mut"><span class="dot" id="dot"></span><span id="api">API: ще не перевірено</span></div>

<div class="card">
<b>Гучність</b><br>
Музика: <span id="mv"></span>%<input type="range" id="mvol" min="0" max="100">
Сигнали: <span id="sv"></span>%<input type="range" id="svol" min="0" max="100">
</div>

<div class="card">
<b>📻 Онлайн-радіо</b><br>
<div class="radio-row">
  <select id="radioSelect">
    <option value="">— виберіть станцію —</option>
  </select>
  <button id="radioPlay">▶ Грати</button>
  <button id="radioStop">⏹ Зупинити</button>
</div>
<div class="mut" id="radioStatus"></div>
</div>

<div class="card">
<b>Налаштування</b><br>
<div id="maps"></div>
<div class="mut">Музика: <span id="mcount">0</span> файлів. Сховище: <span id="quota">?</span></div>
<button id="impM">Імпорт музики (папка 0)</button>
<button id="impS">Імпорт сигналів (папка 1)</button>
<div id="prog" class="mut"></div>
<button id="tR">Тест: червона</button><button id="tY">Тест: жовта</button><button id="tA">Тест: звичайна</button><button id="tC">Тест: відбій</button><button id="tS">Тест: хвилина мовчання</button>
<button id="reset">Скинути позицію в музиці</button>
</div>
<input type="file" id="fM" accept="audio/*,.mp3" multiple hidden>
<input type="file" id="fS" accept="audio/*,.mp3" multiple hidden>

<script>
const CFG={
  API_URL:'https://alerts-proxy.duzyak1232.workers.dev',
  LOCATION_UID:'',                 // за бажанням: uid Хмельницького району з alerts.in.ua
  RAION:'Хмельницький район',
  OBLAST:'Хмельницька область',
  POLL_MS:20000,
  SILENCE:'08:58',
  RELOAD_HOUR:4                    // щоденне перезавантаження о 04:00
};
const $=id=>document.getElementById(id);
const LS={get:(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},
          set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

// ---------- IndexedDB ----------
const dbp=new Promise((res,rej)=>{const r=indexedDB.open('alertbox',1);
  r.onupgradeneeded=()=>{r.result.createObjectStore('music');r.result.createObjectStore('sig')};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function tx(store,mode,fn){const d=await dbp;return new Promise((res,rej)=>{
  const t=d.transaction(store,mode);const o=fn(t.objectStore(store));
  t.oncomplete=()=>res(o&&o.result);t.onerror=t.onabort=()=>rej(t.error)})}
const keys=s=>tx(s,'readonly',o=>o.getAllKeys());
const getB=(s,k)=>tx(s,'readonly',o=>o.get(k));
const nsort=a=>a.sort((x,y)=>x.localeCompare(y,undefined,{numeric:true,sensitivity:'base'}));

// ---------- стан ----------
const M=new Audio();V=new Audio();R=new Audio();
M.preload='auto';V.preload='auto';R.preload='none';
let tracks=[],ti=LS.get('ti',0),started=false,voice=null,queue=[],lvl,playedAlarm=false,mUrl=null,vUrl=null,fails=0;
let userPaused=false,mode=LS.get('mode','seq'),hist=[];
let map=LS.get('map',{}),sigNames=[];
let radioMode=false; // чи грає радіо
const KEY={red:'alarm_r',yellow:'alarm_y',normal:'alarm'};
const VL={alarm_r:'red',alarm_y:'yellow',alarm:'normal'};
const SHOW={red:['red','🔴 ЧЕРВОНА ТРИВОГА'],yellow:['yellow','🟡 ЖОВТА ТРИВОГА'],normal:['orange','🟠 ПОВІТРЯНА ТРИВОГА']};
const LBL={alarm_r:'Тривога червона',alarm_y:'Тривога жовта',alarm:'Тривога звичайна (без кольору)',clear:'Відбій',silence:'Хвилина мовчання'};
// Стандартна гучність: музика 90%, сигнали 100%
const vol={m:LS.get('vm',90),s:LS.get('vs',100)};
function applyVol(){M.volume=vol.m/100;V.volume=vol.s/100;R.volume=vol.m/100;
  $('mv').textContent=vol.m;$('sv').textContent=vol.s;$('mvol').value=vol.m;$('svol').value=vol.s}
$('mvol').oninput=e=>{vol.m=+e.target.value;LS.set('vm',vol.m);applyVol()};
$('svol').oninput=e=>{vol.s=+e.target.value;LS.set('vs',vol.s);applyVol()};
applyVol();

function setState(){
  let cls='',t='';
  const L=(lvl&&lvl!=='none')?lvl:VL[voice];
  if(voice==='silence')t='🕯 ХВИЛИНА МОВЧАННЯ';
  else if(voice==='clear'){cls='green';t='✅ ВІДБІЙ ТРИВОГИ'}
  else if(L&&SHOW[L]){cls=SHOW[L][0];t=SHOW[L][1]}
  else t=started?'Тривоги немає':'Очікування запуску';
  $('state').className=cls;$('state').textContent=t;
  if(voice){$('now').textContent='🔔 '+LBL[voice];$('cnt').textContent=''}
  else if(radioMode){ // показуємо назву станції
    const opt=$('radioSelect').selectedOptions[0];
    $('now').textContent='📻 '+(opt?opt.textContent:'Радіо');
    $('cnt').textContent='';
  }
  else if(tracks.length){$('now').textContent='♪ '+tracks[ti].replace(/\.[^.]+$/,'');$('cnt').textContent=`${ti+1} / ${tracks.length}`}
  else{$('now').textContent='';$('cnt').textContent=''}
  $('pp').textContent=userPaused?'▶ Грати':'⏸ Стоп';
  $('mode').textContent=mode==='rnd'?'🔀 Випадково':'🔁 По порядку';
}

// ---------- музика ----------
async function loadTrack(i,pos){
  if(!tracks.length)return false;
  ti=((i%tracks.length)+tracks.length)%tracks.length;LS.set('ti',ti);
  const b=await getB('music',tracks[ti]);
  if(!b)return false;
  if(mUrl)URL.revokeObjectURL(mUrl);
  mUrl=URL.createObjectURL(b);M.src=mUrl;
  if(pos)M.addEventListener('loadedmetadata',()=>{try{M.currentTime=pos}catch(e){}},{once:true});
  setState();
  return true;
}
async function playMusic(){
  if(voice||userPaused||!tracks.length||radioMode)return;
  try{
    if(!M.src){await loadTrack(ti,LS.get('tp',0))}
    await M.play();started=true;$('start').style.display='none';
  }catch(e){if(e&&e.name==='NotAllowedError'&&!started)$('start').style.display='block'}
  setState();
}
function pickNext(){
  if(mode==='rnd'&&tracks.length>1){
    hist.push(ti);if(hist.length>100)hist.shift();
    let r;do{r=Math.floor(Math.random()*tracks.length)}while(r===ti);
    return r;
  }
  return ti+1;
}
function pickPrev(){
  if(mode==='rnd'&&hist.length)return hist.pop();
  return ti-1;
}
async function goTo(i){LS.set('tp',0);await loadTrack(i);playMusic()}
const goNext=()=>goTo(pickNext());
M.onplaying=()=>{fails=0};
M.onended=()=>goNext();
M.onerror=async()=>{
  if(!tracks.length)return;
  if(++fails>tracks.length)return;
  await new Promise(r=>setTimeout(r,500));goNext()};
setInterval(()=>{if(!M.paused&&M.currentTime)LS.set('tp',Math.floor(M.currentTime))},5000);

// ---------- голосові сигнали (черга з пріоритетом) ----------
async function pump(){
  if(voice)return;
  const k=['silence','alarm_r','alarm_y','alarm','clear'].find(x=>queue.includes(x));
  if(!k){ // якщо сигналів немає — відновлюємо музику або радіо
    if(radioMode){ // якщо був режим радіо, відновлюємо його
      if(R.src&&R.paused){try{await R.play()}catch(e){}}
    } else {
      playMusic();
    }
    return;
  }
  queue=queue.filter(x=>x!==k);
  const f=map[k]||(k.startsWith('alarm')?map.alarm:'');
  const b=f?await getB('sig',f):null;
  if(!b){pump();return}
  if(k.startsWith('alarm'))playedAlarm=true;
  voice=k;M.pause();R.pause();setState(); // зупиняємо і музику, і радіо
  if(vUrl)URL.revokeObjectURL(vUrl);
  vUrl=URL.createObjectURL(b);V.src=vUrl;applyVol();
  V.play().catch(()=>end());
}
function end(){voice=null;setState();pump()}
V.onended=end;V.onerror=end;
function enqueue(k){if(!queue.includes(k))queue.push(k);pump()}

// ---------- API тривоги ----------
function isMine(a){
  if(a.alert_type!=='air_raid'||a.finished_at)return false;
  if(CFG.LOCATION_UID&&String(a.location_uid)===String(CFG.LOCATION_UID))return true;
  if(a.location_title===CFG.RAION&&a.location_oblast===CFG.OBLAST)return true;
  return false;
}
function levelOf(a){return a.alert_level==='red'?'red':a.alert_level==='yellow'?'yellow':'normal'}
function apiStatus(ok,txt){$('dot').style.background=ok?'var(--ok)':'var(--bad)';$('api').textContent='API: '+txt}
async function poll(){
  const tok=LS.get('tok','');
  const direct=CFG.API_URL.includes('api.alerts.in.ua');
  if(direct&&!tok){apiStatus(false,'введіть токен');return}
  try{
    const u=direct?CFG.API_URL+'?token='+encodeURIComponent(tok):CFG.API_URL;
    let r,to;
    if(window.AbortController){
      const ac=new AbortController();to=setTimeout(()=>ac.abort(),10000);
      try{r=await fetch(u,{signal:ac.signal})}finally{clearTimeout(to)}
    }else r=await fetch(u);
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();
    const lv=(j.alerts||[]).filter(isMine).map(levelOf);
    const nl=lv.includes('red')?'red':lv.includes('yellow')?'yellow':lv.length?'normal':'none';
    apiStatus(true,({none:'тихо',red:'червона тривога',yellow:'жовта тривога',normal:'тривога (без кольору)'})[nl]+' · '+new Date().toLocaleTimeString('uk-UA'));
    const old=lvl;lvl=nl;
    if(old!==undefined&&old!==nl){
      queue=queue.filter(x=>!x.startsWith('alarm'));
      if(nl==='none'){
        if(playedAlarm)enqueue('clear');
        playedAlarm=false;
      }else enqueue(KEY[nl]);            // нова тривога або зміна кольору
    }
    setState();
  }catch(e){apiStatus(false,'немає зв’язку ('+(e.name||'')+': '+(e.message||e)+')')}
}
setInterval(poll,CFG.POLL_MS);

// ---------- годинник, 08:58 ----------
const [sh,sm]=CFG.SILENCE.split(':').map(Number),st=sh*60+sm;
setInterval(()=>{
  const d=new Date(),m=d.getHours()*60+d.getMinutes(),day=d.toDateString();
  $('clock').textContent=d.toLocaleTimeString('uk-UA');
  if(LS.get('sday','')!==day&&m>=st&&m<st+5){LS.set('sday',day);enqueue('silence')}
  if(d.getHours()===CFG.RELOAD_HOUR&&d.getMinutes()===0&&performance.now()>36e5&&!voice)location.reload();
},1000);

// ---------- контроль: музика не має стояти без причини ----------
let lastT=-1,still=0;
setInterval(()=>{
  if(!started||userPaused||voice||queue.length||!tracks.length||radioMode)return;
  if(M.error){still=0;goNext();return}
  if(M.paused||M.ended||!M.src){still=0;playMusic();return}
  if(M.currentTime===lastT){if(++still>=4){still=0;goNext()}}   // завис на ~12 с
  else{still=0;lastT=M.currentTime}
},3000);

document.addEventListener('visibilitychange',async()=>{
  try{if(document.visibilityState==='visible')await navigator.wakeLock.request('screen')}catch(e){}
});
try{navigator.wakeLock.request('screen')}catch(e){}

// ---------- імпорт ----------
async function importFiles(store,files){
  const list=[...files].filter(f=>/\.(mp3|wav|ogg|m4a|aac)$/i.test(f.name)||f.type.startsWith('audio/'));
  let n=0;
  for(const f of list){
    try{await tx(store,'readwrite',o=>o.put(f,f.name))}catch(e){$('prog').textContent='Помилка (мало місця?): '+f.name;break}
    $('prog').textContent=`Імпорт ${++n}/${list.length}`;
  }
  $('prog').textContent=`Готово: ${n}`;
  await refresh();
}
$('impM').onclick=()=>$('fM').click();$('impS').onclick=()=>$('fS').click();
$('fM').onchange=e=>importFiles('music',e.target.files);
$('fS').onchange=e=>importFiles('sig',e.target.files);

const RX={alarm_r:/червон|red/i,alarm_y:/жовт|yellow/i,alarm:/тривог|alarm|alert|siren/i,clear:/відбій|відбой|vidbiy|clear/i,silence:/мовч|silen|minute|хвилин/i};
async function refresh(){
  tracks=nsort(await keys('music'));sigNames=nsort(await keys('sig'));
  $('mcount').textContent=tracks.length;
  for(const k of Object.keys(RX)){
    if(!map[k]||!sigNames.includes(map[k]))
      map[k]=sigNames.find(n=>RX[k].test(n)&&(k!=='alarm'||!(RX.alarm_r.test(n)||RX.alarm_y.test(n)||RX.clear.test(n))))||'';
  }
  LS.set('map',map);
  $('maps').innerHTML='';
  for(const k of Object.keys(RX)){
    const l=document.createElement('div');l.textContent=LBL[k]+': ';
    const s=document.createElement('select');
    s.innerHTML='<option value="">— немає —</option>'+sigNames.map(n=>`<option>${n.replace(/</g,'&lt;')}</option>`).join('');
    s.value=map[k]||'';s.onchange=()=>{map[k]=s.value;LS.set('map',map)};
    l.appendChild(s);$('maps').appendChild(l);
  }
  try{const e=await navigator.storage.estimate();$('quota').textContent=`${(e.usage/1e9).toFixed(1)} з ${(e.quota/1e9).toFixed(1)} ГБ`}catch(e){}
  if(ti>=tracks.length)ti=0;
  setState();
}

// ---------- РАДІО ----------
const RADIO_STATIONS = [
  { name: '🇺🇦 Українське радіо (Перший канал)', url: 'https://radio.ukr.radio/ur1-mp3' },
  { name: '🎵 Радіо Промінь', url: 'https://radio.ukr.radio/ur2-mp3' },
  { name: '🎭 Радіо Культура', url: 'https://radio.ukr.radio/ur3-mp3' },
  { name: '🔥 Хіт FM', url: 'https://www.online.hitfm.ua/HitFM' },
  { name: '🎸 Radio ROKS', url: 'https://online.radioroks.ua/RadioROKS_NewRock_HD' },
  { name: '🚀 Радіо Байрактар', url: 'https://online.radiobayraktar.ua/' },
  { name: '🎉 Радіо П’ятниця', url: 'http://cast.radiopyatnica.com.ua:8000/radiopyatnica' },
  { name: '📡 NovaLine', url: 'https://stream.novaline.net.ua/Novaline_320' },
];

const radioSelect = $('radioSelect');
RADIO_STATIONS.forEach((st, idx) => {
  const opt = document.createElement('option');
  opt.value = st.url;
  opt.textContent = st.name;
  radioSelect.appendChild(opt);
});

function setRadioStatus(txt, isError = false) {
  $('radioStatus').textContent = txt;
  $('radioStatus').style.color = isError ? 'var(--bad)' : 'var(--mut)';
}

async function playRadio() {
  const url = radioSelect.value;
  if (!url) { setRadioStatus('Виберіть станцію', true); return; }
  if (voice) { setRadioStatus('Зачекайте, грає сигнал тривоги…', true); return; }
  try {
    // Зупиняємо локальну музику
    M.pause();
    userPaused = false;
    radioMode = true;
    if (R.src) R.pause();
    R.src = url;
    R.load();
    await R.play();
    started = true;
    $('start').style.display = 'none';
    setRadioStatus('Грає: ' + radioSelect.selectedOptions[0].textContent);
    setState();
  } catch (e) {
    radioMode = false;
    setRadioStatus('Помилка відтворення: ' + (e.message || e), true);
    setState();
  }
}

function stopRadio() {
  R.pause();
  R.removeAttribute('src');
  radioMode = false;
  setRadioStatus('Радіо зупинено');
  setState();
  // Відновлюємо локальну музику, якщо є треки
  if (tracks.length && !voice) playMusic();
}

$('radioPlay').onclick = playRadio;
$('radioStop').onclick = stopRadio;
R.onerror = () => {
  radioMode = false;
  setRadioStatus('Потік недоступний. Спробуйте іншу станцію.', true);
  setState();
};

// ---------- кнопки ----------
$('tR').onclick=()=>enqueue('alarm_r');$('tY').onclick=()=>enqueue('alarm_y');$('tA').onclick=()=>enqueue('alarm');
$('tC').onclick=()=>enqueue('clear');$('tS').onclick=()=>enqueue('silence');
$('reset').onclick=()=>{LS.set('ti',0);LS.set('tp',0);ti=0;hist=[];M.removeAttribute('src');playMusic()};
$('start').onclick=()=>{started=true;$('start').style.display='none';pump()};
document.addEventListener('click',()=>{if(!started){started=true;pump()}},{once:true});

$('pp').onclick=()=>{
  if(radioMode){ // якщо грає радіо, кнопка "Стоп" зупиняє його
    if(R.paused){R.play().catch(()=>{})}
    else{R.pause()}
    return;
  }
  if(userPaused){userPaused=false;started=true;playMusic()}
  else{userPaused=true;M.pause()}
  setState();
};
$('next').onclick=()=>{userPaused=false;started=true;goNext()};
$('prev').onclick=()=>{userPaused=false;started=true;goTo(pickPrev())};
$('mode').onclick=()=>{mode=mode==='rnd'?'seq':'rnd';hist=[];LS.set('mode',mode);setState()};

(async()=>{
  try{await navigator.storage.persist()}catch(e){}
  await refresh();
  poll();
  playMusic();
})();
</script></body></html>
