<script>
const CFG={
  API_URL:'https://alerts-proxy.duzyak1232.workers.dev',
  LOCATION_UID:'',
  RAION:'Хмельницький район',
  OBLAST:'Хмельницька область',
  POLL_MS:20000,
  SILENCE:'08:58',
  RELOAD_HOUR:4
};
const $=id=>document.getElementById(id);
const LS={get:(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},
          set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

// ---------- IndexedDB (версія 3 - додано сховище meta) ----------
const dbp=new Promise((res,rej)=>{const r=indexedDB.open('alertbox',3);
  r.onupgradeneeded=()=>{
    const db=r.result;
    if(!db.objectStoreNames.contains('music')) db.createObjectStore('music');
    if(!db.objectStoreNames.contains('sig'))   db.createObjectStore('sig');
    if(!db.objectStoreNames.contains('hour'))  db.createObjectStore('hour');
    if(!db.objectStoreNames.contains('meta'))  db.createObjectStore('meta'); // Для метаданих
  };
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function tx(store,mode,fn){const d=await dbp;return new Promise((res,rej)=>{
  const t=d.transaction(store,mode);const o=fn(t.objectStore(store));
  t.oncomplete=()=>res(o&&o.result);t.onerror=t.onabort=()=>rej(t.error)})}
const keys=s=>tx(s,'readonly',o=>o.getAllKeys());
const getB=(s,k)=>tx(s,'readonly',o=>o.get(k));
const nsort=a=>a.sort((x,y)=>x.localeCompare(y,undefined,{numeric:true,sensitivity:'base'}));

// ---------- стан ----------
const M=new Audio(),V=new Audio(),R=new Audio();
M.preload='auto'; R.preload='none';
let tracks=[],trackMeta={},ti=LS.get('ti',0),started=false,voice=null,queue=[],lvl,playedAlarm=false,mUrl=null,vUrl=null,fails=0;
let userPaused=false,mode=LS.get('mode','seq'),hist=[];
let map=LS.get('map',{}),sigNames=[];
let radioIsPlaying=false, radioWasPlayingDuringVoice=false;
const KEY={red:'alarm_r',yellow:'alarm_y',normal:'alarm'};
const VL={alarm_r:'red',alarm_y:'yellow',alarm:'normal'};
const SHOW={red:['red','🔴 ЧЕРВОНА ТРИВОГА'],yellow:['yellow','🟡 ЖОВТА ТРИВОГА'],normal:['orange','🟠 ПОВІТРЯНА ТРИВОГА']};
const LBL={alarm_r:'Тривога червона',alarm_y:'Тривога жовта',alarm:'Тривога звичайна (без кольору)',clear:'Відбій',silence:'Хвилина мовчання'};

const vol={m:LS.get('vm',80),s:LS.get('vs',100)};
function applyVol(){
  M.volume=vol.m/100; V.volume=vol.s/100; R.volume=vol.m/100;
  $('mv').textContent=vol.m;$('sv').textContent=vol.s;
  $('mvol').value=vol.m;$('svol').value=vol.s;
}
$('mvol').oninput=e=>{vol.m=+e.target.value;LS.set('vm',vol.m);applyVol()};
$('svol').oninput=e=>{vol.s=+e.target.value;LS.set('vs',vol.s);applyVol()};
applyVol();

function setState(){
  let cls='',t='';
  const L=(lvl&&lvl!=='none')?lvl:VL[voice];
  if(voice==='silence')t='🕯 ХВИЛИНА МОВЧАННЯ';
  else if(voice==='clear'){cls='green';t='✅ ВІДБІЙ ТРИВОГИ'}
  else if(L&&SHOW[L]){cls=SHOW[L][0];t=SHOW[L][1]}
  else t=started?'Тривоги немає':'Очікування запуску';
  $('state').className=cls;$('state').textContent=t;

  if(voice){$('now').textContent='🔔 '+LBL[voice];$('cnt').textContent=''}
  else if(radioIsPlaying){$('now').textContent='📻 '+(R.dataset.name||'Радіо');$('cnt').textContent=''}
  else if(tracks.length){
    const meta = trackMeta[tracks[ti]] || {title:tracks[ti]};
    $('now').textContent='♪ '+meta.title;
    $('cnt').textContent=`${ti+1} / ${tracks.length}`;
  }
  else{$('now').textContent='';$('cnt').textContent=''}

  $('pp').textContent=userPaused?'▶ Грати':'⏸ Стоп';
  $('mode').textContent=mode==='rnd'?'🔀 Випадково':'🔁 По порядку';
  
  renderPlaylist();
}

// ---------- Плейлист ----------
function renderPlaylist(){
  if(!tracks.length) return;
  const pl = $('playlist');
  
  if(pl.children.length !== tracks.length){
    pl.innerHTML = tracks.map((k,i)=>{
      const m = trackMeta[k] || {title:k, artist:'', dur:0};
      const dStr = (m.dur && m.dur > 0) ? new Date(m.dur*1000).toISOString().substr(14,5) : '--:--';
      // Очищаємо назву від розширення, якщо це ім'я файлу
      const displayTitle = m.title ? m.title.replace(/\.[^.]+$/, '') : k.replace(/\.[^.]+$/, '');
      return `<div class="track-item" id="track-${i}" onclick="playFromList(${i})">
        <div class="track-num">${i+1}</div>
        <div class="track-title">${displayTitle}</div>
        <div class="track-artist">${m.artist||''}</div>
        <div class="track-dur">${dStr}</div>
      </div>`;
    }).join('');
  }
  
  document.querySelectorAll('.track-item').forEach(el=>el.classList.remove('active'));
  const act = $('track-'+ti);
  if(act){
    act.classList.add('active');
    act.scrollIntoView({block:'nearest', behavior:'smooth'});
  }
}

// ---------- музика ----------
async function loadTrack(i,pos){
  if(!tracks.length)return false;
  ti=((i%tracks.length)+tracks.length)%tracks.length;LS.set('ti',ti);
  const b=await getB('music',tracks[ti]);
  if(!b)return false;
  if(mUrl)URL.revokeObjectURL(mUrl);
  mUrl=URL.createObjectURL(b);M.src=mUrl;
  if(pos)M.addEventListener('loadedmetadata',()=>{try{M.currentTime=pos}catch(e){}},{once:true});
  setState();
  return true;
}
async function playMusic(){
  if(voice||userPaused||!tracks.length||radioIsPlaying)return;
  try{
    if(!M.src){await loadTrack(ti,LS.get('tp',0))}
    await M.play();started=true;$('start').style.display='none';
  }catch(e){if(e&&e.name==='NotAllowedError'&&!started)$('start').style.display='block'}
  setState();
}
function playFromList(i){ userPaused=false; started=true; goTo(i); }

function pickNext(){
  if(mode==='rnd'&&tracks.length>1){
    hist.push(ti);if(hist.length>100)hist.shift();
    let r;do{r=Math.floor(Math.random()*tracks.length)}while(r===ti);
    return r;
  }
  return ti+1;
}
function pickPrev(){
  if(mode==='rnd'&&hist.length)return hist.pop();
  return ti-1;
}
async function goTo(i){LS.set('tp',0);await loadTrack(i);playMusic()}
const goNext=()=>goTo(pickNext());
M.onplaying=()=>{fails=0};
M.onended=()=>goNext();
M.onerror=async()=>{
  if(!tracks.length)return;
  if(++fails>tracks.length)return;
  await new Promise(r=>setTimeout(r,500));goNext()};
setInterval(()=>{if(!M.paused&&M.currentTime)LS.set('tp',Math.floor(M.currentTime))},5000);

// ---------- сигнали ----------
async function pump(){
  if(voice)return;
  const k=['silence','alarm_r','alarm_y','alarm','clear'].find(x=>queue.includes(x));
  if(!k){ if(!radioIsPlaying) playMusic(); return; }
  queue=queue.filter(x=>x!==k);
  const f=map[k]||(k.startsWith('alarm')?map.alarm:'');
  const b=f?await getB('sig',f):null;
  if(!b){pump();return}
  if(k.startsWith('alarm'))playedAlarm=true;

  voice=k;
  M.pause();
  if(!R.paused){radioWasPlayingDuringVoice=true;R.pause()}
  setState();

  if(vUrl)URL.revokeObjectURL(vUrl);
  vUrl=URL.createObjectURL(b);V.src=vUrl;applyVol();
  V.play().catch(()=>end());
}
function end(){
  voice=null;setState();
  if(radioWasPlayingDuringVoice && radioIsPlaying){
    radioWasPlayingDuringVoice=false;
    R.play().catch(()=>{});
    return;
  }
  radioWasPlayingDuringVoice=false;
  pump();
}
V.onended=end;V.onerror=end;
function enqueue(k){if(!queue.includes(k))queue.push(k);pump()}

// ---------- API ----------
function isMine(a){
  if(a.alert_type!=='air_raid'||a.finished_at)return false;
  if(CFG.LOCATION_UID&&String(a.location_uid)===String(CFG.LOCATION_UID))return true;
  if(a.location_title===CFG.RAION&&a.location_oblast===CFG.OBLAST)return true;
  return false;
}
function levelOf(a){return a.alert_level==='red'?'red':a.alert_level==='yellow'?'yellow':'normal'}
function apiStatus(ok,txt){$('dot').style.background=ok?'var(--ok)':'var(--bad)';$('api').textContent='API: '+txt}
async function poll(){
  const tok=LS.get('tok','');
  const direct=CFG.API_URL.includes('api.alerts.in.ua');
  if(direct&&!tok){apiStatus(false,'введіть токен');return}
  try{
    const u=direct?CFG.API_URL+'?token='+encodeURIComponent(tok):CFG.API_URL;
    let r,to;
    if(window.AbortController){
      const ac=new AbortController();to=setTimeout(()=>ac.abort(),10000);
      try{r=await fetch(u,{signal:ac.signal})}finally{clearTimeout(to)}
    }else r=await fetch(u);
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();
    const lv=(j.alerts||[]).filter(isMine).map(levelOf);
    const nl=lv.includes('red')?'red':lv.includes('yellow')?'yellow':lv.length?'normal':'none';
    apiStatus(true,({none:'тихо',red:'червона тривога',yellow:'жовта тривога',normal:'тривога (без кольору)'})[nl]+' · '+new Date().toLocaleTimeString('uk-UA'));
    const old=lvl;lvl=nl;
    if(old!==undefined&&old!==nl){
      queue=queue.filter(x=>!x.startsWith('alarm'));
      if(nl==='none'){
        if(playedAlarm)enqueue('clear');
        playedAlarm=false;
      }else enqueue(KEY[nl]);
    }
    setState();
  }catch(e){apiStatus(false,'немає зв’язку ('+(e.name||'')+': '+(e.message||e)+')')}
}
setInterval(poll,CFG.POLL_MS);

// ---------- годинник ----------
const [sh,sm]=CFG.SILENCE.split(':').map(Number),st=sh*60+sm;
setInterval(()=>{
  const d=new Date(),m=d.getHours()*60+d.getMinutes(),day=d.toDateString();
  $('clock').textContent=d.toLocaleTimeString('uk-UA');
  if(LS.get('sday','')!==day&&m>=st&&m<st+5){LS.set('sday',day);enqueue('silence')}
  if(d.getHours()===CFG.RELOAD_HOUR&&d.getMinutes()===1&&performance.now()>36e5&&!voice)location.reload();
},1000);

// ---------- контроль ----------
let lastT=-1,still=0;
setInterval(()=>{
  if(!started||userPaused||voice||queue.length||!tracks.length||radioIsPlaying)return;
  if(M.error){still=0;goNext();return}
  if(M.paused||M.ended||!M.src){still=0;playMusic();return}
  if(M.currentTime===lastT){if(++still>=4){still=0;goNext()}}
  else{still=0;lastT=M.currentTime}
},3000);

document.addEventListener('visibilitychange',async()=>{
  try{if(document.visibilityState==='visible')await navigator.wakeLock.request('screen')}catch(e){}
});
try{navigator.wakeLock.request('screen')}catch(e){}

// ---------- Отримання метаданих (Теги + Тривалість) ----------
function extractMetadata(file) {
  return new Promise((resolve) => {
    let meta = {
      title: file.name.replace(/\.[^.]+$/, ''), 
      artist: '',
      dur: 0
    };

    let tagsDone = false;
    let audioDone = false;

    const checkDone = () => {
      if (tagsDone && audioDone) resolve(meta);
    };

    // 1. Читаємо теги (швидко і незалежно)
    jsmediatags.read(file, {
      onSuccess: function(tag) {
        if (tag.tags.title) meta.title = tag.tags.title;
        if (tag.tags.artist) meta.artist = tag.tags.artist;
        tagsDone = true;
        checkDone();
      },
      onError: function() {
        tagsDone = true;
        checkDone();
      }
    });

    // 2. Читаємо тривалість (через аудіо-об'єкт)
    const url = URL.createObjectURL(file);
    const audio = new Audio(url);
    audio.preload = 'metadata';
    
    audio.addEventListener('loadedmetadata', () => {
      meta.dur = audio.duration;
      URL.revokeObjectURL(url);
      audioDone = true;
      checkDone();
    });

    audio.addEventListener('error', () => {
      URL.revokeObjectURL(url);
      audioDone = true;
      checkDone();
    });

    // Запобіжник: якщо через 3 секунди аудіо не завантажилось, пропускаємо
    setTimeout(() => {
        if(!audioDone) {
            URL.revokeObjectURL(url);
            audioDone = true;
            checkDone();
        }
    }, 3000);
  });
}

// Оновлення метаданих для ВЖЕ імпортованих треків
$('scanTags').onclick = async () => {
  if(!tracks.length) return alert('Спочатку імпортуйте музику!');
  $('scanTags').disabled = true;
  $('scanTags').textContent = '⏳ Сканування...';
  
  for(let i=0; i<tracks.length; i++) {
    $('scanTags').textContent = `⏳ ${i+1}/${tracks.length}`;
    const b = await getB('music', tracks[i]);
    if(b) {
      const meta = await extractMetadata(b);
      await tx('meta','readwrite', o=>o.put(meta, tracks[i]));
      trackMeta[tracks[i]] = meta;
    }
    // Оновлюємо UI кожні кілька треків
    if(i % 5 === 0) {
        $('playlist').innerHTML = ''; // Скидаємо, щоб перемалювати
        renderPlaylist();
    }
  }
  
  $('scanTags').disabled = false;
  $('scanTags').textContent = '🔄 Оновити назви';
  $('playlist').innerHTML = '';
  renderPlaylist();
  setState();
  alert('Готово! Теги оновлено.');
};

// ---------- імпорт ----------
async function importFiles(store,files){
  const list=[...files].filter(f=>/\.(mp3|wav|ogg|m4a|aac)$/i.test(f.name)||f.type.startsWith('audio/'));
  let n=0;
  for(const f of list){
    try{
      await tx(store,'readwrite',o=>o.put(f,f.name));
      if(store === 'music') {
        const meta = await extractMetadata(f);
        await tx('meta','readwrite', o=>o.put(meta, f.name));
        trackMeta[f.name] = meta;
      }
    }catch(e){$('prog').textContent='Помилка: '+f.name;break}
    $('prog').textContent=`Імпорт ${++n}/${list.length}`;
  }
  $('prog').textContent=`Готово: ${n}`;
  await refresh();
}

$('impM').onclick=()=>$('fM').click();$('impS').onclick=()=>$('fS').click();
$('fM').onchange=e=>importFiles('music',e.target.files);
$('fS').onchange=e=>importFiles('sig',e.target.files);

const RX={alarm_r:/червон|red/i,alarm_y:/жовт|yellow/i,alarm:/тривог|alarm|alert|siren/i,clear:/відбій|відбой|vidbiy|clear/i,silence:/мовч|silen|minute|хвилин/i};

async function refresh(){
  tracks=nsort(await keys('music'));
  sigNames=nsort(await keys('sig'));
  $('mcount').textContent=tracks.length;

  // Завантажуємо метадані з IndexedDB
  trackMeta = {};
  const metas = await tx('meta', 'readonly', o => o.getAllKeys()).then(keys => Promise.all(keys.map(k => getB('meta', k).then(m => ({k, m})))));
  metas.forEach(({k, m}) => { if(m) trackMeta[k] = m; });

  for(const k of Object.keys(RX)){
    if(!map[k]||!sigNames.includes(map[k]))
      map[k]=sigNames.find(n=>RX[k].test(n)&&(k!=='alarm'||!(RX.alarm_r.test(n)||RX.alarm_y.test(n)||RX.clear.test(n))))||'';
  }
  LS.set('map',map);
  $('maps').innerHTML='';
  for(const k of Object.keys(RX)){
    const l=document.createElement('div');l.textContent=LBL[k]+': ';
    const s=document.createElement('select');
    s.innerHTML='<option value="">— немає —</option>'+sigNames.map(n=>`<option>${n.replace(/</g,'&lt;')}</option>`).join('');
    s.value=map[k]||'';s.onchange=()=>{map[k]=s.value;LS.set('map',map)};
    l.appendChild(s);$('maps').appendChild(l);
  }
  try{const e=await navigator.storage.estimate();$('quota').textContent=`${(e.usage/1e9).toFixed(2)} з ${(e.quota/1e9).toFixed(1)} ГБ`}catch(e){}
  if(ti>=tracks.length)ti=0;
  $('playlist').innerHTML = ''; // Примусово перемальовуємо список
  setState();
}

// ---------- кнопки ----------
$('tR').onclick=()=>enqueue('alarm_r');$('tY').onclick=()=>enqueue('alarm_y');$('tA').onclick=()=>enqueue('alarm');
$('tC').onclick=()=>enqueue('clear');$('tS').onclick=()=>enqueue('silence');
$('reset').onclick=()=>{LS.set('ti',0);LS.set('tp',0);ti=0;hist=[];M.removeAttribute('src');playMusic()};
$('start').onclick=()=>{started=true;$('start').style.display='none';pump()};
document.addEventListener('click',()=>{if(!started){started=true;pump()}},{once:true});

$('pp').onclick=()=>{
  if(userPaused){userPaused=false;started=true;playMusic()}
  else{userPaused=true;M.pause()}
  setState();
};
$('next').onclick=()=>{userPaused=false;started=true;goNext()};
$('prev').onclick=()=>{userPaused=false;started=true;goTo(pickPrev())};
$('mode').onclick=()=>{mode=mode==='rnd'?'seq':'rnd';hist=[];LS.set('mode',mode);setState()};

// ---------- РАДІО ----------
const RADIO_STATIONS = [
  { name: 'Misto FM Deep',   url: 'https://stream.mistofm.com/listen/misto_fm_deep/radio.mp3' },
  { name: 'Хіт FM',          url: 'https://www.hitfm.ua/HitFM.m3u' },
  { name: 'Kiss FM',         url: 'https://online.kissfm.ua/KissFM_Digital_HD' },
  { name: 'Radio ROKS',      url: 'https://online.radioroks.ua/RadioROKS' },
  { name: 'Наше Радіо',      url: 'https://online.nasheradio.ua/NasheRadio' },
  { name: 'Lux FM',          url: 'https://streamvideo.luxnet.ua/lux/smil:lux.stream.smil/playlist.m3u8' },
  { name: 'Радіо Промінь',   url: 'https://radio.nrcu.gov.ua:8443/promin' },
  { name: 'Країна ФМ',       url: 'http://185.65.245.34:8000/kiev' },
  { name: 'Армія FM',        url: 'https://icecast.armyfm.com.ua:8443/ArmyFM' },
  { name: 'Радіо 1',         url: 'https://live.radio1.com.ua/liveradio64' }
];

(function fillRadioSelect(){
  const sel=$('radioSelect');
  sel.innerHTML=RADIO_STATIONS.map((s,i)=>`<option value="${i}">${s.name}</option>`).join('');
})();

$('radioPlay').onclick=async()=>{
  const idx=+$('radioSelect').value;
  const st=RADIO_STATIONS[idx];
  if(!st)return;
  M.pause();M.removeAttribute('src');
  V.pause();V.removeAttribute('src');voice=null;
  radioWasPlayingDuringVoice=false;
  userPaused=false;
  R.src=st.url;R.dataset.name=st.name;R.volume=vol.m/100;
  try{
    await R.play();
    radioIsPlaying=true;
    $('radioStatus').textContent='Грає: '+st.name;
    started=true;$('start').style.display='none';
  }catch(e){
    radioIsPlaying=false;
    $('radioStatus').textContent='Помилка: '+(e.message||e);
  }
  setState();
};
$('radioStop').onclick=()=>{
  R.pause();R.removeAttribute('src');R.dataset.name='';
  radioIsPlaying=false;
  $('radioStatus').textContent='';
  if(tracks.length) playMusic();
  else setState();
};
R.onerror=()=>{$('radioStatus').textContent='Потік недоступний';radioIsPlaying=false;R.removeAttribute('src');setState()};
R.onended=()=>{radioIsPlaying=false;R.removeAttribute('src');setState()};

// ---------- ініціалізація ----------
(async()=>{
  try{await navigator.storage.persist()}catch(e){}
  await refresh();
  poll();
  playMusic();
})();
</script></body></html>
